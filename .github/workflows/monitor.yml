name: VOX Showtime Monitor

on:
  schedule:
    - cron: "*/30 * * * *"

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vox-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check showtimes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # always(): still persist state if main.py failed after sending
      # some alerts, so those aren't re-sent on the next run.
      - name: Save notification state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update movie notification state"
            git pull --rebase origin main
            git push
          fi
